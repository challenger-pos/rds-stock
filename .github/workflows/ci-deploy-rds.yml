name: CI - Deploy RDS Stock Database

on:
  push:
    branches:
      - main
      - homologation
      - feature/*
  workflow_dispatch:

env:
  TERRAFORM_RDS_DIR: .
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || (github.ref_name == 'homologation' && 'homologation' || 'dev') }}

jobs:
  deploy-rds:
    name: Deploy RDS Stock Database
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || (github.ref_name == 'homologation' && 'homologation' || 'dev') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.7

      - name: Terraform RDS Init
        working-directory: ${{ env.TERRAFORM_RDS_DIR }}/envs/${{ env.ENVIRONMENT }}
        run: terraform init -backend-config="key=rds-stock/${{ env.ENVIRONMENT }}/terraform.tfstate"

      - name: Terraform RDS Plan
        working-directory: ${{ env.TERRAFORM_RDS_DIR }}/envs/${{ env.ENVIRONMENT }}
        run: terraform plan -var-file="terraform.tfvars" -var-file="secrets.tfvars"
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

      - name: Terraform RDS Apply
        working-directory: ${{ env.TERRAFORM_RDS_DIR }}/envs/${{ env.ENVIRONMENT }}
        run: terraform apply -auto-approve -var-file="terraform.tfvars" -var-file="secrets.tfvars"
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

      - name: Terraform Outputs
        working-directory: ${{ env.TERRAFORM_RDS_DIR }}/envs/${{ env.ENVIRONMENT }}
        run: terraform output -json
